{
  "name": "Windows Electron validation / separately approved candidate",
  "on": {
    "push": {
      "branches": [
        "test/windows-electron-candidate"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "batch10-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "if": "github.repository == 'piomeer/shotloom' && github.ref == 'refs/heads/test/windows-electron-candidate' && github.event_name == 'push'",
      "runs-on": "windows-2022",
      "timeout-minutes": 90,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "env": {
        "CI": "true",
        "CSC_IDENTITY_AUTO_DISCOVERY": "false",
        "ELECTRON_SKIP_BINARY_DOWNLOAD": "1",
        "npm_config_registry": "https://registry.npmjs.org/",
        "npm_config_audit": "false",
        "npm_config_fund": "false",
        "npm_config_update_notifier": "false",
        "npm_config_cache": "${{ github.workspace }}\\tmp\\batch09\\npm-cache",
        "npm_config_store_dir": "${{ github.workspace }}\\tmp\\batch09\\pnpm-store",
        "ELECTRON_CACHE": "${{ github.workspace }}\\tmp\\batch09\\electron-cache",
        "ELECTRON_BUILDER_CACHE": "${{ github.workspace }}\\tmp\\batch09\\builder-cache",
        "TEMP": "${{ github.workspace }}\\tmp\\batch09\\temp",
        "TMP": "${{ github.workspace }}\\tmp\\batch09\\temp",
        "electron_config_cache": "${{ github.workspace }}\\tmp\\batch09\\electron-cache",
        "LOCALAPPDATA": "${{ github.workspace }}\\tmp\\batch09\\profile\\local",
        "APPDATA": "${{ github.workspace }}\\tmp\\batch09\\profile\\roaming",
        "NODE_COMPILE_CACHE": "${{ github.workspace }}\\tmp\\batch09\\node-compile-cache",
        "npm_config_userconfig": "${{ github.workspace }}\\tmp\\batch09\\npmrc",
        "SHOTLOOM_PNPM": "\"${{ github.workspace }}\\tmp\\batch09\\pnpm.cmd\"",
        "FFMPEG_BIN": "${{ github.workspace }}\\node_modules\\ffmpeg-static\\ffmpeg.exe"
      },
      "steps": [
        {
          "name": "Checkout this exact test commit",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "name": "Read runner CPU, RAM, disks and preinstalled tools",
          "shell": "pwsh",
          "run": "./.github/shotloom-electron-test/inventory.ps1"
        },
        {
          "name": "Set exact project Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".node-version",
            "check-latest": false
          }
        },
        {
          "name": "Authorize Node22 validation; expose independently approved build mode",
          "run": "node .github/shotloom-electron-test/ci.mjs authorize",
          "id": "approval"
        },
        {
          "name": "VALIDATE: Root lockfile dependencies without install scripts",
          "run": "node .github/shotloom-electron-test/ci.mjs root-deps"
        },
        {
          "name": "VALIDATE: Recovery public-behavior tests (22 required)",
          "run": "node .github/shotloom-electron-test/ci.mjs focused"
        },
        {
          "name": "VALIDATE: Electron typecheck",
          "run": "node .github/shotloom-electron-test/ci.mjs typecheck"
        },
        {
          "name": "VALIDATE: Related Electron runtime and storage regressions",
          "run": "node .github/shotloom-electron-test/ci.mjs related"
        },
        {
          "name": "VALIDATE: Test architecture",
          "run": "node .github/shotloom-electron-test/ci.mjs architecture"
        },
        {
          "name": "BUILD: Approved locked FFmpeg installation script",
          "run": "node .github/shotloom-electron-test/ci.mjs native-root",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Approved locked Host and native dependencies",
          "run": "node .github/shotloom-electron-test/ci.mjs host-deps",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Director lockfile dependencies",
          "run": "node .github/shotloom-electron-test/ci.mjs director-deps",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Pinned OpenReel pnpm workspace",
          "run": "node .github/shotloom-electron-test/ci.mjs openreel",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Prepare disposable candidate-only isolation config",
          "run": "node .github/shotloom-electron-test/ci.mjs prepare",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Typecheck candidate-only bootstrap and updater",
          "run": "node .github/shotloom-electron-test/ci.mjs candidate-typecheck",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Official directory packaging (no installer/publish)",
          "run": "node .github/shotloom-electron-test/ci.mjs package",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "BUILD: Inspect complete resource closure and local SHA256 manifest",
          "run": "node .github/shotloom-electron-test/ci.mjs resources",
          "if": "steps.approval.outputs.build == 'true'"
        },
        {
          "name": "EVIDENCE: Validate the two authorized text files only",
          "if": "steps.approval.outputs.build == 'true' && steps.approval.outputs.text == 'true'",
          "run": "node .github/shotloom-electron-test/ci.mjs evidence"
        },
        {
          "name": "EVIDENCE: Separately authorized JSON metadata only",
          "if": "steps.approval.outputs.build == 'true' && steps.approval.outputs.text == 'true'",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "candidate-text-evidence",
            "path": "${{ github.workspace }}/tmp/batch09/text-evidence/candidate-summary.json\n${{ github.workspace }}/tmp/batch09/text-evidence/candidate-manifest.json",
            "retention-days": 1,
            "include-hidden-files": false,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Print sanitized validation summary only",
          "if": "always()",
          "run": "node .github/shotloom-electron-test/ci.mjs summary"
        }
      ]
    }
  }
}
